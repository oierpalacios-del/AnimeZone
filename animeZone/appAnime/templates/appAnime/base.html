
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Anime Zone{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'appAnime/css/estilos.css' %}">
</head>

<body>
    <header class="cabecera">
        <a class="logo" href="{% url 'appAnime:home' %}">
            <span class="logo-icono">✿</span>
            <span>AnimeZone <span class="corazon">♡</span></span>
        </a>

        <nav>
            <a href="{% url 'appAnime:home' %}">Inicio</a>
            <a href="{% url 'appAnime:lista_series' %}">Series</a>
            <a href="{% url 'appAnime:lista_generos' %}">Géneros</a>
            <a href="{% url 'appAnime:lista_estudios' %}">Estudios</a>
        </nav>
    </header>

    <main class="contenedor">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="pie">
        <p>AnimeZone ♡ Descubre tu próximo anime favorito</p>
    </footer>
</body>
</html>
